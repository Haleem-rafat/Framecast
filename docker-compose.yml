services:
  postgres:
    image: postgres:17-alpine
    container_name: framecast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-framecast}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: framecast-app
    restart: unless-stopped
    # Only started for the containerised stack; `pnpm dev` talks to postgres directly.
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-framecast}
      # The `postgres` service above speaks no TLS at all (plain postgres:17-alpine).
      # config/env.ts only allows this for dot-free (private/container) hostnames.
      DATABASE_SSL_DISABLE: "true"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Objects live on local disk now, not in a bucket. Left at the image's
      # own defaults (src/config/env.ts) rather than set here: this stack is
      # for local work, and a container-internal path is exactly what a
      # throwaway `docker compose --profile full up` wants. Set STORAGE_ROOT
      # and RENDER_ROOT with volumes if you need what it writes to survive.
    ports:
      - "3000:3000"

volumes:
  postgres-data:
