# .github/workflows/build-images.yml

name: Build images

# The server pulls what this publishes; nothing heavy ever runs on a box that
# has 4GB and a database in it.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image's build failure (or an ffmpeg-encoder assertion tripping in
      # worker/Dockerfile) shouldn't cancel the other mid-push and leave it
      # unbuilt too.
      fail-fast: false
      matrix:
        include:
          - image: framecast-app
            dockerfile: Dockerfile
          - image: framecast-worker
            dockerfile: worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase in image paths, and this repo's owner
      # (Haleem-rafat) has one. `github.repository_owner` is the literal
      # GitHub login and Actions expression syntax has no case-conversion
      # function, so lowercasing has to happen in a shell step instead.
      # `${VAR,,}` is bash's built-in lowercase expansion. The result must
      # match `GITHUB_OWNER` as set on the server in deploy/docker-compose.yml
      # (see deploy/README.md, "GITHUB_OWNER must be lowercase") — both need
      # to land on ghcr.io/haleem-rafat/... or the compose pull finds
      # nothing.
      - name: Lowercase the image owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE_OWNER=${OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:latest
          # `scope` keeps the two matrix legs from fighting over the same
          # cache: the gha backend's default scope is constant across a
          # workflow run, so framecast-app and framecast-worker would
          # otherwise overwrite each other's cache on every run instead of
          # each building up its own.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
