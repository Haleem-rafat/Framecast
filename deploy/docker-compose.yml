# deploy/docker-compose.yml
#
# The whole of Framecast on one VPS: 2 vCPU, 4GB RAM, 40GB disk.
#
# Two environments share one Postgres instance holding two databases. A second
# Postgres would cost ~400MB of 4GB for isolation the databases already give.
#
# Files live on the host under /srv/framecast so a container rebuild cannot
# destroy them.

name: framecast

# `mem_limit` on every service: on 4GB total, an unbounded process (a leak, or
# ffmpeg on an unexpectedly large source) would otherwise let the kernel OOM
# killer pick its own victim system-wide — which could as easily be postgres
# or a healthy app process as the one actually misbehaving. A per-service
# cap makes the kill land on the offending container's own cgroup instead,
# and `restart: unless-stopped` brings it straight back. That is deliberately
# cheap to recover from here: a worker killed mid-render leaves its video
# claimed under a lease (`LEASE_SECONDS` in `src/services/job.service.ts`)
# that lapses after 10 minutes with no heartbeat, after which any worker
# reclaims it and the render simply runs again — the same recovery path an
# ordinary redeploy already relies on. An app process killed mid-request just
# drops that request; Caddy serves a brief 502 until the restart lands.
# Limits sum to ~3GB across the five services that run by default, leaving
# ~1GB for the OS, the Docker daemon, and bursts — see deploy/README.md for
# the full breakdown and the swap this still assumes exists (Task 9).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app-prod, app-staging]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 640m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: framecast
    volumes:
      - /srv/framecast/postgres:/var/lib/postgresql/data
      - ./init-staging-db.sh:/docker-entrypoint-initdb.d/init-staging-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Postgres defaults assume far more memory than this box has.
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB
               -c max_connections=50 -c work_mem=4MB

  app-prod:
    image: ghcr.io/${GITHUB_OWNER}/framecast-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 512m
    # Matches the UID:GID the image already runs as (app/Dockerfile's `USER
    # nextjs`, created at 1001:1001). Stated explicitly here, not just in the
    # image, because it is also the contract with the bind-mounted host
    # directories below: /srv/framecast/prod/{storage,renders} must be
    # chowned to 1001:1001 in provisioning, or this container can read what
    # it mounts but not write or delete it. See deploy/README.md.
    user: "1001:1001"
    env_file: /srv/framecast/env/prod.env
    volumes:
      - /srv/framecast/prod/storage:/data/storage
      - /srv/framecast/prod/renders:/data/renders
    depends_on:
      postgres: { condition: service_healthy }

  worker-prod:
    image: ghcr.io/${GITHUB_OWNER}/framecast-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 1408m
    # Same UID:GID as app-prod (worker/Dockerfile's `USER worker`, also
    # 1001:1001) — the two containers share these directories, so both must
    # agree on who owns files in them. See deploy/README.md.
    user: "1001:1001"
    env_file: /srv/framecast/env/prod.env
    volumes:
      - /srv/framecast/prod/storage:/data/storage
      - /srv/framecast/prod/renders:/data/renders
    depends_on:
      postgres: { condition: service_healthy }
    # ffmpeg will take every core it is given. cpu_shares is a relative weight
    # under contention, not a hard cap: it lets a render use both cores when
    # nothing else needs them, but yields CPU to app-prod and postgres (default
    # weight 1024) the moment they ask for it, rather than always capping the
    # worker to a fixed fraction and stretching every render regardless of
    # whether the site is even under load. See deploy/README.md for the
    # tradeoff against a hard --cpus limit.
    cpu_shares: 512

  app-staging:
    image: ghcr.io/${GITHUB_OWNER}/framecast-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 384m
    user: "1001:1001"
    env_file: /srv/framecast/env/staging.env
    volumes:
      - /srv/framecast/staging/storage:/data/storage
      - /srv/framecast/staging/renders:/data/renders
    depends_on:
      postgres: { condition: service_healthy }

  # Started deliberately, never automatically: two renders on two cores would
  # make both slow and the site unusable. Starting it alongside a production
  # render also stacks its 896m memory limit on top of the ~3GB the five
  # always-on services already budget for — briefly, not as a steady state.
  #   docker compose --profile staging-worker up -d worker-staging
  #   docker compose stop worker-staging
  worker-staging:
    image: ghcr.io/${GITHUB_OWNER}/framecast-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 896m
    user: "1001:1001"
    profiles: [staging-worker]
    env_file: /srv/framecast/env/staging.env
    volumes:
      - /srv/framecast/staging/storage:/data/storage
      - /srv/framecast/staging/renders:/data/renders
    depends_on:
      postgres: { condition: service_healthy }
    cpu_shares: 256

volumes:
  caddy-data:
  caddy-config:
