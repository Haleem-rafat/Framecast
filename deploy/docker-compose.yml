# deploy/docker-compose.yml
#
# The whole of Framecast on one VPS: 2 vCPU, 4GB RAM, 40GB disk.
#
# Two environments share one Postgres instance holding two databases. A second
# Postgres would cost ~400MB of 4GB for isolation the databases already give.
#
# Files live on the host under /srv/framecast so a container rebuild cannot
# destroy them.

name: framecast

# `mem_limit` on every service: on 4GB total, an unbounded process (a leak, or
# ffmpeg on an unexpectedly large source) would otherwise let the kernel OOM
# killer pick its own victim system-wide — which could as easily be postgres
# or a healthy app process as the one actually misbehaving. A per-service
# cap makes the kill land on the offending container's own cgroup instead,
# and `restart: unless-stopped` brings it straight back. That is deliberately
# cheap to recover from here: a worker killed mid-render leaves its video
# claimed under a lease (`LEASE_SECONDS` in `src/services/job.service.ts`)
# that lapses after 10 minutes with no heartbeat, after which any worker
# reclaims it and the render simply runs again — the same recovery path an
# ordinary redeploy already relies on. An app process killed mid-request just
# drops that request; Caddy serves a brief 502 until the restart lands.
# Limits sum to ~3GB across the five services that run by default, leaving
# ~1GB for the OS, the Docker daemon, and bursts — see deploy/README.md for
# the full breakdown and the swap this still assumes exists (Task 9).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app-prod, app-staging]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 640m
    environment:
      # `:?` rather than a bare `${...}`: an unset value here would otherwise
      # interpolate to the empty string, the healthcheck below would become
      # `pg_isready -U ` and never pass, and every `depends_on:
      # service_healthy` would wait forever with nothing naming the cause.
      # With `:?`, `docker compose up` stops immediately and prints the
      # variable's name. See deploy/compose.env.example.
      POSTGRES_USER: ${POSTGRES_USER:?see deploy/compose.env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see deploy/compose.env.example}
      POSTGRES_DB: framecast
    volumes:
      - /srv/framecast/postgres:/var/lib/postgresql/data
      - ./init-staging-db.sh:/docker-entrypoint-initdb.d/init-staging-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Postgres defaults assume far more memory than this box has.
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB
               -c max_connections=50 -c work_mem=4MB

  app-prod:
    image: ghcr.io/${GITHUB_OWNER:?see deploy/compose.env.example}/framecast-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 1024m, not the 512m a "Next.js server" would suggest, because publishing
    # runs in this process: `publishVideoAction` (a Server Action) calls
    # `publishService.publish()`, which buffers the whole ~170MB render into
    # memory for YouTube's resumable upload (see the comment at
    # src/services/publish.service.ts's `fileBuffer`), with a transient peak
    # near double that while the chunks are concatenated — on top of the
    # 150-250MB a Next.js standalone server already holds. An OOM kill here is
    # not the cheap, self-healing kind described above: the Publication row is
    # written `UPLOADING` *before* the upload, SIGKILL skips the catch that
    # would mark it FAILED, and every retry then hits
    # ConflictError("This video is already being published.") while YouTube may
    # already hold the video. Do not trim this back.
    mem_limit: 1024m
    # Matches the UID:GID the image already runs as (app/Dockerfile's `USER
    # nextjs`, created at 1001:1001). Stated explicitly here, not just in the
    # image, because it is also the contract with the bind-mounted host
    # directories below: /srv/framecast/prod/{storage,renders} must be
    # chowned to 1001:1001 in provisioning, or this container can read what
    # it mounts but not write or delete it. See deploy/README.md.
    user: "1001:1001"
    env_file: /srv/framecast/env/prod.env
    volumes:
      - /srv/framecast/prod/storage:/data/storage
      - /srv/framecast/prod/renders:/data/renders
    depends_on:
      postgres: { condition: service_healthy }

  worker-prod:
    image: ghcr.io/${GITHUB_OWNER:?see deploy/compose.env.example}/framecast-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 640m, down from the 1408m this held before app-prod's publish buffer was
    # accounted for. The room the two app services now need came from here on
    # purpose: a worker killed mid-render is recovered automatically by the
    # lease lapse described at the top of this file, while an app killed
    # mid-publish is not recoverable without manual work and risks a duplicate
    # YouTube upload. Put the margin where the failure is unrecoverable.
    # 640m is workable because rendering no longer scales with the video:
    # ffmpeg runs one decoder and one encoder at a time across two passes
    # (see src/lib/ffmpeg-command.ts), so memory is flat in both clip count
    # and duration. If a render is ever OOM-killed here, raise this and take
    # it back from `app-staging` — a staging publish is always supervised.
    mem_limit: 640m
    # Same UID:GID as app-prod (worker/Dockerfile's `USER worker`, also
    # 1001:1001) — the two containers share these directories, so both must
    # agree on who owns files in them. See deploy/README.md.
    user: "1001:1001"
    env_file: /srv/framecast/env/prod.env
    volumes:
      - /srv/framecast/prod/storage:/data/storage
      - /srv/framecast/prod/renders:/data/renders
    depends_on:
      postgres: { condition: service_healthy }
    # ffmpeg will take every core it is given. cpu_shares is a relative weight
    # under contention, not a hard cap: it lets a render use both cores when
    # nothing else needs them, but yields CPU to app-prod and postgres (default
    # weight 1024) the moment they ask for it, rather than always capping the
    # worker to a fixed fraction and stretching every render regardless of
    # whether the site is even under load. See deploy/README.md for the
    # tradeoff against a hard --cpus limit.
    cpu_shares: 512

  app-staging:
    image: ghcr.io/${GITHUB_OWNER:?see deploy/compose.env.example}/framecast-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Same process as app-prod, and the staging proof in the runbook publishes
    # a real video — so it holds the same ~170MB render buffer app-prod does.
    # Lighter traffic, not a lighter peak; 384m would be killed by the first
    # staging publish.
    mem_limit: 640m
    user: "1001:1001"
    env_file: /srv/framecast/env/staging.env
    volumes:
      - /srv/framecast/staging/storage:/data/storage
      - /srv/framecast/staging/renders:/data/renders
    depends_on:
      postgres: { condition: service_healthy }

  # Started deliberately, never automatically: two renders on two cores would
  # make both slow and the site unusable. Starting it alongside a production
  # render also stacks its 640m memory limit on top of the ~3GB the five
  # always-on services already budget for — briefly, not as a steady state.
  #   docker compose --profile staging-worker up -d worker-staging
  #   docker compose stop worker-staging
  worker-staging:
    image: ghcr.io/${GITHUB_OWNER:?see deploy/compose.env.example}/framecast-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Matches worker-prod rather than undercutting it: it runs the identical
    # pipeline, and the staging render is the proof that the pipeline works at
    # all. A smaller limit here would mean a staging render that dies where a
    # production one would have survived — the opposite of what staging is for.
    mem_limit: 640m
    user: "1001:1001"
    profiles: [staging-worker]
    env_file: /srv/framecast/env/staging.env
    volumes:
      - /srv/framecast/staging/storage:/data/storage
      - /srv/framecast/staging/renders:/data/renders
    depends_on:
      postgres: { condition: service_healthy }
    cpu_shares: 256

volumes:
  caddy-data:
  caddy-config:
